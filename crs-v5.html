<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prescrição · CRS Coophavila</title><style>
*{box-sizing:border-box}html,body,#host{width:100%;height:100%;margin:0}body{overflow:hidden;background:#eef4f9;font-family:Inter,system-ui,sans-serif}#host{border:0;display:block}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#eef4f9;color:#526b80;font-size:13px}.hidden{display:none}.save-badge{position:fixed;right:18px;top:10px;z-index:40;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #efc46f;border-radius:999px;background:#fff9ea;color:#8b5a09;font-size:12px;font-weight:800;box-shadow:0 5px 18px rgba(32,66,96,.12);pointer-events:none}.save-badge.saved{border-color:#8bc8aa;background:#eefaf4;color:#257653}.save-badge.saving{border-color:#a8c9e7;background:#f0f7fd;color:#1d659e}.save-dot{width:8px;height:8px;border-radius:50%;background:currentColor}.save-badge strong{font-weight:900}.save-badge span{font-weight:700}
</style></head>
<body><div id="loading" class="loading">Carregando prescrição completa…</div><iframe id="host" class="hidden" title="Prescrição CRS"></iframe><div id="save-badge" class="save-badge"><i class="save-dot"></i><strong>Alterações não salvas</strong><span id="save-time"></span></div>
<script>
(()=>{
'use strict';
const qs=new URLSearchParams(location.search);
const patientId=String(qs.get('patientId')||'').trim();
const returnOrigin=String(qs.get('returnOrigin')||'').trim();
const host=document.getElementById('host'),loading=document.getElementById('loading'),badge=document.getElementById('save-badge'),saveTime=document.getElementById('save-time');
const APP_DRAFT_KEY='prescricao_draft_session_v2';
let cachedContext=null,innerReady=false,loaded=false,dirty=false,savedDraftRaw='',pollTimer=null,trackingReady=false;
function outer(){return window.parent&&window.parent!==window?window.parent:window.opener}
function postOuter(message){const target=outer();if(!target)throw new Error('Abra a prescrição pela Central CRS.');target.postMessage(message,returnOrigin||'*')}
function safeSessionSnapshot(){const out={};try{const raw=sessionStorage.getItem(APP_DRAFT_KEY);if(raw)out[APP_DRAFT_KEY]=raw}catch{}return out}
function currentDraftRaw(){try{return sessionStorage.getItem(APP_DRAFT_KEY)||''}catch{return''}}
function clearAppDraft(){try{sessionStorage.removeItem(APP_DRAFT_KEY)}catch{}}
function restoreAppDraft(snapshot){clearAppDraft();const store=snapshot?.sessionStorage;if(!store||typeof store!=='object')return false;const raw=store[APP_DRAFT_KEY];if(typeof raw!=='string'||!raw)return false;try{const parsed=JSON.parse(raw);if(!parsed||parsed.version!==2)return false;sessionStorage.setItem(APP_DRAFT_KEY,raw);return true}catch{return false}}
function setDirty(next){next=!!next;if(dirty===next)return;dirty=next;badge.className='save-badge'+(dirty?'':' saved');badge.querySelector('strong').textContent=dirty?'Alterações não salvas':'Prescrição salva';if(dirty)saveTime.textContent='';postOuterSafe({type:'CRS_PRESCRIPTION_DIRTY_STATE',patientId,dirty})}
function setSaving(){badge.className='save-badge saving';badge.querySelector('strong').textContent='Salvando…';saveTime.textContent=''}
function markSaved(){savedDraftRaw=currentDraftRaw();dirty=false;const now=new Date();badge.className='save-badge saved';badge.querySelector('strong').textContent='✅ Prescrição salva';saveTime.textContent='às '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});postOuterSafe({type:'CRS_PRESCRIPTION_DIRTY_STATE',patientId,dirty:false,savedAt:now.toISOString()})}
function postOuterSafe(message){try{postOuter(message)}catch{}}
function renameCensoToInternacao(){try{const doc=host.contentDocument;if(!doc)return;doc.querySelectorAll('label.choice').forEach(label=>{const input=label.querySelector('input[value="censo"]');if(!input)return;[...label.childNodes].forEach(node=>{if(node.nodeType===Node.TEXT_NODE&&/censo/i.test(node.textContent||''))node.textContent=(node.textContent||'').replace(/Censo/gi,'Internação')})});const frame=doc.getElementById('presc');if(frame?.contentDocument){frame.contentDocument.querySelectorAll('option,button,label,span,div').forEach(el=>{if(el.children.length===0&&el.textContent?.trim()==='Censo')el.textContent='Internação'})}}catch{}}
function startTracking(){if(pollTimer)return;setTimeout(()=>{savedDraftRaw=currentDraftRaw();trackingReady=true;renameCensoToInternacao();pollTimer=setInterval(()=>{renameCensoToInternacao();if(!trackingReady)return;const raw=currentDraftRaw();if(raw!==savedDraftRaw)setDirty(true)},500)},1400)}
function loadEditor(){if(loaded)return;loaded=true;const u=new URL('./crs-v4.html',location.href);for(const [k,v] of qs.entries())if(k!=='v')u.searchParams.set(k,v);u.searchParams.set('v','5-'+Date.now());host.src=u.toString();host.classList.remove('hidden');loading.classList.add('hidden');host.addEventListener('load',()=>{renameCensoToInternacao();startTracking()},{once:false})}
function sendContextToInner(){if(!innerReady||!cachedContext)return;try{host.contentWindow.postMessage(cachedContext,location.origin)}catch{}}
window.addEventListener('message',event=>{
 const data=event.data;if(!data||typeof data!=='object')return;
 if(event.source===host.contentWindow){
   if(data.type==='CRS_PRESCRIPTION_READY_V2'){innerReady=true;sendContextToInner();return}
   if(data.type==='CRS_PRESCRIPTION_SAVE_V2'){setSaving();const next={...data,snapshot:{...(data.snapshot||{}),sessionStorage:safeSessionSnapshot(),stateCaptureVersion:1}};postOuterSafe(next);return}
   if(data.type==='CRS_PRESCRIPTION_HISTORY_READY'){postOuterSafe(data);return}
   return;
 }
 if(returnOrigin&&event.origin!==returnOrigin)return;
 if(outer()&&event.source!==outer())return;
 if(data.type==='CRS_PRESCRIPTION_CONTEXT_V2'&&data.patientId===patientId){cachedContext=data;restoreAppDraft(data.snapshot);savedDraftRaw=currentDraftRaw();loadEditor();sendContextToInner();return}
 if(data.type==='CRS_PRESCRIPTION_SAVE_RESULT'){try{host.contentWindow.postMessage(data,location.origin)}catch{};if(data.ok)markSaved();else setDirty(true);return}
});
window.addEventListener('beforeunload',event=>{if(!dirty)return;event.preventDefault();event.returnValue='Há alterações não salvas na prescrição.';return event.returnValue});
try{if(!patientId)throw new Error('Paciente não identificado.');postOuter({type:'CRS_PRESCRIPTION_READY_V2',patientId});postOuterSafe({type:'CRS_PRESCRIPTION_DIRTY_STATE',patientId,dirty:false});setTimeout(()=>{if(!loaded){clearAppDraft();savedDraftRaw='';loadEditor()}},2500)}catch(error){loading.textContent=error?.message||'Não foi possível abrir a prescrição.'}
})();
</script></body></html>
