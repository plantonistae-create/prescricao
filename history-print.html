<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Imprimir prescrição · CRS Coophavila</title>
<style>
:root{--bg:#eef4f9;--card:#fff;--line:#d7e2ec;--ink:#183047;--dim:#6b7c8a;--blue:#1578d4;--red:#c72d36}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{display:grid;grid-template-rows:54px minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line)}.mark{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900}.title{min-width:0}.title b{display:block;font-size:13px}.title span{display:block;font-size:10px;color:var(--dim);margin-top:2px}.spacer{flex:1}.status{font-size:11px;color:var(--dim);text-align:right}.status.ok{color:#247d59}.status.err{color:var(--red)}
main{position:relative;min-height:0}.frame{width:100%;height:100%;border:0;background:#fff;display:none}.frame.ready{display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px}.box{max-width:520px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;box-shadow:0 10px 30px rgba(40,70,95,.08)}.box h2{font-size:16px;margin:0 0 7px}.box p{font-size:12px;color:var(--dim);line-height:1.5;margin:0}.actions{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}.btn{border:1px solid #c8d6e2;border-radius:8px;background:#fff;color:#24394b;padding:9px 12px;font-weight:750;font-size:12px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.hidden{display:none!important}
</style>
</head>
<body>
<header><div class="mark">+</div><div class="title"><b>CRS Coophavila · Prescrição salva</b><span id="patient-label">Preparando impressão no layout original</span></div><div class="spacer"></div><div id="status" class="status">Conectando à Central CRS…</div></header>
<main>
  <iframe id="presc" class="frame" title="Prescrição para impressão"></iframe>
  <div id="loading" class="loading"><div class="box"><h2 id="loading-title">Preparando prescrição…</h2><p id="loading-text">A versão salva será restaurada temporariamente no prescritor original para preservar a mesma diagramação.</p><div id="fallback-actions" class="actions hidden"><button id="retry" class="btn primary" type="button">Tentar imprimir novamente</button><button id="close" class="btn" type="button">Fechar</button></div></div></div>
</main>
<script>
(()=>{
'use strict';
const qs=new URLSearchParams(location.search);
const patientId=qs.get('patientId')||'';
const prescriptionId=qs.get('prescriptionId')||'';
const returnOrigin=qs.get('returnOrigin')||'';
const frame=document.getElementById('presc');
const statusEl=document.getElementById('status');
const loading=document.getElementById('loading');
const loadingTitle=document.getElementById('loading-title');
const loadingText=document.getElementById('loading-text');
const fallback=document.getElementById('fallback-actions');
const patientLabel=document.getElementById('patient-label');
let context=null,snapshot=null,backup=null,storagePrepared=false,frameLoaded=false,printing=false,cleaned=false,attempt=0;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function setStatus(text,kind=''){statusEl.textContent=text;statusEl.className='status '+kind}
function fail(message){setStatus('Falha ao preparar','err');loading.classList.remove('hidden');frame.classList.remove('ready');loadingTitle.textContent='Não foi possível preparar a impressão';loadingText.textContent=message||'Tente novamente.';fallback.classList.remove('hidden');cleanupStorage()}
function target(){return window.opener||null}
function post(message){const w=target();if(!w)throw new Error('Abra esta impressão pela Central CRS.');w.postMessage(message,returnOrigin||'*')}
function isAppKey(key){return !!key&&!key.startsWith('crs-temp:')&&!key.startsWith('crs-presc-draft:')&&/presc|rascun|draft|pacient|receit|medic|item|form/.test(norm(key))}
function prepareStorage(obj){if(storagePrepared)return;storagePrepared=true;backup={};try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(isAppKey(k))keys.push(k)}for(const k of keys){backup[k]=localStorage.getItem(k);localStorage.removeItem(k)}if(obj&&typeof obj==='object'){for(const[k,v]of Object.entries(obj)){if(isAppKey(k)&&typeof v==='string')localStorage.setItem(k,v)}}}catch(e){throw new Error('Não foi possível restaurar o estado salvo da prescrição.') }}
function cleanupStorage(){if(cleaned||!storagePrepared)return;cleaned=true;try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(isAppKey(k))keys.push(k)}for(const k of keys)localStorage.removeItem(k);for(const[k,v]of Object.entries(backup||{}))if(v!=null)localStorage.setItem(k,v)}catch{}}
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch{return null}}
function restoreControls(list){const d=doc();if(!d||!Array.isArray(list))return;const all=[...d.querySelectorAll('input,textarea,select')];for(const c of list){let el=c.id?d.getElementById(c.id):null;if(!el&&c.name){try{el=d.querySelector('[name="'+CSS.escape(c.name)+'"]')}catch{}}if(!el)el=all[c.i];if(!el)continue;try{if(el.type==='checkbox'||el.type==='radio')el.checked=!!c.checked;else if(el.tagName==='SELECT'){[...el.options].forEach((o,j)=>o.selected=Array.isArray(c.selected)&&c.selected.includes(j))}else el.value=c.value??'';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}catch{}}}
function visible(el){if(!el)return false;const style=getComputedStyle(el);return style.display!=='none'&&style.visibility!=='hidden'&&el.getClientRects().length>0&&!el.disabled}
function actionButton(terms){const d=doc();if(!d)return null;const list=[...d.querySelectorAll('button,.btn,input[type="button"],input[type="submit"],a[role="button"]')];return list.find(el=>visible(el)&&terms.some(t=>norm(el.textContent||el.value||el.getAttribute('aria-label')||'').includes(t)))||null}
function applyPatientFallback(){const d=doc(),p=context?.patient||{};if(!d||!p)return;const fields=[...d.querySelectorAll('input,textarea,select')];const label=el=>norm((el.placeholder||'')+' '+(el.name||'')+' '+(el.id||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.closest('label')?.textContent||''));const set=(words,value)=>{if(value==null||value==='')return;const el=fields.find(x=>words.some(w=>label(x).includes(w)));if(!el)return;try{if(el.tagName==='SELECT'){const n=norm(value),o=[...el.options].find(x=>norm(x.value)===n||norm(x.textContent).includes(n));if(o)el.value=o.value}else el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}catch{}};set(['nome do paciente','nome paciente'],p.name);set(['idade'],p.age);set(['sexo'],p.sex)}
function showOriginal(){loading.classList.add('hidden');frame.classList.add('ready');setStatus('Prescrição restaurada','ok')}
function waitForButton(terms,timeout=4500){return new Promise(resolve=>{const start=Date.now();const tick=()=>{const b=actionButton(terms);if(b)return resolve(b);if(Date.now()-start>=timeout)return resolve(null);setTimeout(tick,140)};tick()})}
async function nativePrint(){if(printing||!frameLoaded)return;printing=true;attempt++;try{restoreControls(snapshot?.controls);applyPatientFallback();await new Promise(r=>setTimeout(r,450));restoreControls(snapshot?.controls);applyPatientFallback();const review=await waitForButton(['revisar e imprimir','revisar'],2200);if(review){review.click();await new Promise(r=>setTimeout(r,500))}const print=await waitForButton(['imprimir pdf','imprimir','gerar pdf'],4200);if(print){setStatus('Abrindo impressão…','ok');print.click();setTimeout(cleanupStorage,9000);return}showOriginal();loading.classList.remove('hidden');loadingTitle.textContent='Prescrição restaurada';loadingText.textContent='O layout original foi carregado, mas o botão automático de impressão não foi localizado. Use o botão de impressão do próprio prescritor abaixo.';fallback.classList.remove('hidden')}catch(e){fail(e.message||'Falha ao acionar a impressão.')}finally{printing=false}}
function loadFrame(){try{prepareStorage(snapshot?.localStorage||{});frame.src='./index.html?crs_embed=1&crs_history_print=1&v='+Date.now();setStatus('Restaurando versão salva…')}catch(e){fail(e.message)}}
frame.addEventListener('load',()=>{frameLoaded=true;setTimeout(()=>{restoreControls(snapshot?.controls);applyPatientFallback()},280);setTimeout(()=>{restoreControls(snapshot?.controls);applyPatientFallback()},850);setTimeout(nativePrint,1250);try{frame.contentWindow.addEventListener('afterprint',()=>setTimeout(cleanupStorage,250),{once:true})}catch{}});
window.addEventListener('afterprint',()=>setTimeout(cleanupStorage,250),{once:true});
window.addEventListener('beforeunload',cleanupStorage);
document.getElementById('retry').onclick=()=>{fallback.classList.add('hidden');loading.classList.add('hidden');frame.classList.add('ready');nativePrint()};
document.getElementById('close').onclick=()=>{cleanupStorage();window.close()};
window.addEventListener('message',e=>{if(!e.data||typeof e.data!=='object')return;if(returnOrigin&&e.origin!==returnOrigin)return;if(target()&&e.source!==target())return;if(e.data.type==='CRS_PRESCRIPTION_HISTORY_CONTEXT'&&e.data.patientId===patientId&&e.data.prescriptionId===prescriptionId){if(e.data.error)return fail(e.data.error);context=e.data.context||null;snapshot=e.data.snapshot||null;if(!snapshot||typeof snapshot!=='object')return fail('Esta versão não possui os dados necessários para reconstruir a prescrição.');const p=context?.patient;if(p?.name)patientLabel.textContent=p.name+' · versão salva';loadFrame()}});
try{if(!patientId||!prescriptionId)throw new Error('Prescrição histórica não identificada.');post({type:'CRS_PRESCRIPTION_HISTORY_READY',patientId,prescriptionId})}catch(e){fail(e.message)}
})();
</script>
</body>
</html>
