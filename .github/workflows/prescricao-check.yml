name: Verificação da prescrição isolada
on:
  push:
    branches:
      - main
      - feat/medicamentos-cartao-ceftriaxona-20261101
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes BIC, DOCX e ceftriaxona
        run: node --test tests/*.test.mjs
      - name: Preparar automação de navegador
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Homologação Chromium real
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node tests/browser-smoke.mjs
      - name: Validar duas páginas reais do Word (LibreOffice)
        run: |
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libreoffice-writer poppler-utils
          fi
          mkdir -p artifacts/qa/word-render
          libreoffice -env:UserInstallation=file:///tmp/lo-prescricao-qa --headless --convert-to pdf --outdir artifacts/qa/word-render \
            artifacts/qa/prescricao-qa.docx artifacts/qa/prescricao-28-itens.docx
          for path in artifacts/qa/word-render/*.pdf; do
            pages="$(pdfinfo "$path" | awk '/^Pages:/ {print $2}')"
            echo "$path: $pages página(s)"
            test "$pages" -eq 2 || { echo "::error::$path: Word precisa ter exatamente duas páginas"; exit 1; }
            page1="$(pdftotext -f 1 -l 1 "$path" -)"
            page2="$(pdftotext -f 2 -l 2 "$path" -)"
            echo "$page1" | grep -Fq 'Assinatura e carimbo do(a) médico(a)' || {
              echo "::error::$path: assinatura médica ausente na frente (página 1)"; exit 1;
            }
            if echo "$page2" | grep -Fq 'Assinatura e carimbo do(a) médico(a)'; then
              echo "::error::$path: assinatura médica indevidamente no verso"; exit 1;
            fi
            if echo "$page1" | grep -Fq 'SINAIS VITAIS'; then
              echo "::error::$path: sinais vitais vazaram para a primeira página"; exit 1;
            fi
            echo "$page2" | grep -Fq 'SINAIS VITAIS' || {
              echo "::error::$path: sinais vitais ausentes no verso (página 2)"; exit 1;
            }
            echo "$page2" | grep -Fq 'RELATÓRIO / ANOTAÇÕES DE ENFERMAGEM' || {
              echo "::error::$path: anotações de enfermagem ausentes no verso"; exit 1;
            }
            echo "$path: assinatura na frente, sinais vitais e enfermagem no verso."
          done
          test "$(pdfinfo artifacts/qa/prescricao-e-cartao.pdf | awk '/^Pages:/ {print $2}')" = 3 || { echo "::error::Prescrição + cartão novo precisa ter 3 páginas"; exit 1; }
          test "$(pdfinfo artifacts/qa/ficha-gif.pdf | awk '/^Pages:/ {print $2}')" = 2 || { echo "::error::Ficha GIF antiga precisa ter 2 páginas"; exit 1; }
          pdftoppm -png -f 1 -l 2 -r 105 artifacts/qa/word-render/prescricao-28-itens.pdf artifacts/qa/word-render/word28
          pdftoppm -png -f 1 -l 2 -r 105 artifacts/qa/word-render/prescricao-qa.pdf artifacts/qa/word-render/wordPadrao
          for ecg in artifacts/qa/formulario-ecg-isolado.pdf artifacts/qa/formulario-ecg-com-ceftriaxona.pdf; do
            test -s "$ecg" || { echo "::error::ECG não gerado: $ecg"; exit 1; }
            pages="$(pdfinfo "$ecg" | awk '/^Pages:/ {print $2}')"
            images="$(pdfimages -list "$ecg" | awk 'NR>2{n++} END{print n+0}')"
            echo "$ecg: $pages páginas, $images imagens renderizadas"
            test "$pages" -eq 2 || { echo "::error::ECG deveria ter 2 páginas: $ecg"; exit 1; }
            test "$images" -ge 2 || { echo "::error::ECG vazio ou sem formulários: $ecg"; exit 1; }
          done
          echo "Pacote ceftriaxona: prescrição e cartão 3 páginas + GIF antiga 2 páginas. Word: 2 páginas. ECG: 2 páginas com imagens."
      - name: Guardar evidências de navegação e impressão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-prescricao-visual
          path: artifacts/qa/
          if-no-files-found: warn
