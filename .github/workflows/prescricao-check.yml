name: Verificação da prescrição isolada
on:
  push:
    branches:
      - main
      - feat/medicamentos-cartao-ceftriaxona-20261101
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes BIC, DOCX e ceftriaxona
        run: node --test tests/*.test.mjs
