<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f8fc">
<title>Prescrição · CRS Coophavila</title>
<style>
:root{--bg:#eef4f9;--card:#fff;--line:#d7e2ec;--ink:#183047;--dim:#6b7c8a;--blue:#1578d4;--blue2:#0f66b8;--amber:#e49a1b;--green:#2c9b6d;--red:#d9343b;--red2:#b9252d}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{overflow:hidden}.shell{height:100%;display:grid;grid-template-rows:46px minmax(0,1fr) auto}.bar{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);background:#fff}.emblem{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-weight:900;color:#fff}.brand{min-width:0}.brand b{display:block;font-size:13px}.brand span{display:block;font-size:9px;color:var(--dim);margin-top:1px;text-transform:uppercase;letter-spacing:.07em;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spacer{flex:1}.status{font-size:10.5px;color:var(--dim);white-space:nowrap}.status.ok{color:#247d59}.status.err{color:#b7252f}.frame{width:100%;height:100%;border:0;background:#fff}.flow{background:#fff;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -7px 22px rgba(32,66,96,.07)}.flow-inner{max-width:1460px;margin:0 auto;display:grid;grid-template-columns:auto minmax(410px,1fr) auto;gap:10px;align-items:center}.flow-title{font-size:10.5px;font-weight:850;text-transform:uppercase;letter-spacing:.07em;color:#566f83;white-space:nowrap}.destinations{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.choice{display:flex;align-items:center;gap:5px;border:1px solid #cbd8e4;border-radius:8px;padding:7px 9px;background:#f9fbfd;font-size:11.5px;font-weight:750;cursor:pointer}.choice input{margin:0;accent-color:var(--blue)}.choice:has(input:checked){border-color:#72aee0;background:#edf6ff;color:#115d9d}.choice.alta:has(input:checked){border-color:#7fc3a5;background:#edf9f4;color:#247a57}.choice.reav:has(input:checked){border-color:#efc26d;background:#fff8e9;color:#98600b}.sector{display:none;min-width:180px;padding:7px 8px;border:1px solid #cbd8e4;border-radius:8px;background:#fff;color:var(--ink);font-size:11.5px}.sector.show{display:block}.actions{display:flex;gap:6px;align-items:center}.btn{border:1px solid #c8d6e2;border-radius:8px;background:#fff;color:#24394b;padding:8px 10px;font-weight:780;font-size:11.5px;cursor:pointer;white-space:nowrap}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn.danger:hover{background:var(--red2);border-color:var(--red2)}.btn:disabled{opacity:.55;cursor:wait}.btn.top-clear{padding:7px 9px;font-size:10.5px}.save-state{max-width:1460px;margin:5px auto 0;font-size:10px;color:var(--dim)}.save-state.ok{color:#247d59}.save-state.err{color:#b7252f}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:9px;z-index:90;opacity:0;pointer-events:none;transition:.18s;color:var(--ink);font-size:11.5px;box-shadow:0 12px 35px rgba(32,66,96,.16)}.toast.show{opacity:1}.toast.err{border-color:#e6a6aa;color:#b6242e}
@media(max-width:820px){.shell{grid-template-rows:42px minmax(0,1fr) auto}.bar{padding:5px 8px;gap:7px}.emblem{width:28px;height:28px}.brand span,.status{display:none}.btn.top-clear{padding:6px 8px;font-size:10px}.flow{padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.flow-inner{grid-template-columns:1fr;gap:6px}.flow-title{display:none}.destinations{display:grid;grid-template-columns:repeat(3,1fr)}.choice{justify-content:center;padding:7px 5px}.sector{grid-column:1/-1;width:100%}.actions{justify-content:stretch}.actions .btn{flex:1}.save-state{display:none}.toast{bottom:132px}}
</style>
</head>
<body>
<div class="shell">
<header class="bar"><div class="emblem">+</div><div class="brand"><b>CRS Coophavila · Prescrição</b><span id="patient-label">Urgência e Emergência</span></div><div class="spacer"></div><button id="clear-all-top" class="btn danger top-clear" type="button">🗑 Limpar tudo</button><span class="status" id="status">Conectando…</span></header>
<iframe id="presc" class="frame" src="./index.html?crs_embed=1" title="Prescrição"></iframe>
<footer class="flow"><div class="flow-inner"><div class="flow-title">Destino após a prescrição</div><div class="destinations"><label class="choice alta"><input type="radio" name="dest" value="alta">Alta</label><label class="choice reav"><input type="radio" name="dest" value="reavaliacao">Reavaliação</label><label class="choice"><input type="radio" name="dest" value="censo">Censo</label><select id="sector" class="sector"><option value="emergencia">Emergência</option><option value="infantil">Enfermaria Infantil</option><option value="feminina">Enfermaria Feminina</option><option value="masculina">Enfermaria Masculina</option></select></div><div class="actions"><button id="save-preview" class="btn">Salvar prévia</button><button id="save-final" class="btn primary">Salvar sem imprimir</button></div></div><div id="save-state" class="save-state">Autossalvamento local ativo.</div></footer>
</div><div id="toast" class="toast"></div>
<script>
(()=>{
'use strict';
const qs=new URLSearchParams(location.search);
const patientId=qs.get('patientId')||(crypto.randomUUID?crypto.randomUUID():'p-'+Date.now());
const returnOrigin=qs.get('returnOrigin')||'';
const frame=document.getElementById('presc'),statusEl=document.getElementById('status'),patientLabel=document.getElementById('patient-label'),sectorEl=document.getElementById('sector'),saveState=document.getElementById('save-state'),topClear=document.getElementById('clear-all-top');
const draftKey='crs-temp:'+patientId;
let context=null,centralSnapshot=null,restored=false,reloaded=false,timer=null,bypass=null,bypassClear=null,clearBusy=false,clearedSession=false;
const pending=new Map();
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const uid=()=>crypto.randomUUID?crypto.randomUUID():'r-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function toast(msg,err=false){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='toast',2600)}
function setStatus(text,kind=''){statusEl.textContent=text;statusEl.className='status '+kind}
function targetWindow(){if(window.parent&&window.parent!==window)return window.parent;if(window.opener)return window.opener;return null}
function post(msg){const target=targetWindow();if(!target)throw new Error('Abra a prescrição pela Central CRS para salvar.');target.postMessage(msg,returnOrigin||'*')}
function d(){try{return frame.contentDocument||frame.contentWindow.document}catch{return null}}
function baseLabel(el,doc){let s=(el.placeholder||'')+' '+(el.name||'')+' '+(el.id||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('autocomplete')||'');if(el.id){try{const l=doc.querySelector('label[for="'+CSS.escape(el.id)+'"]');if(l)s+=' '+l.textContent}catch{}}if(el.closest('label'))s+=' '+el.closest('label').textContent;return norm(s)}
function around(el){let s='';let node=el.parentElement;for(let i=0;i<3&&node;i++,node=node.parentElement){const t=norm(node.innerText||'');s+=' '+t.slice(0,500)}return s}
function usable(el){if(!el||el.disabled||el.type==='hidden')return false;try{const cs=frame.contentWindow.getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden')return false}catch{}return true}
function controlsVisible(){const doc=d();return doc?[...doc.querySelectorAll('input,textarea,select')].filter(usable):[]}
function scoreField(el,kind){const doc=d();if(!doc)return-1;const meta=baseLabel(el,doc),near=around(el),value=String(el.value??'').trim();let s=0;
 if(kind==='name'){
   if(meta.includes('nome do paciente'))s+=500;else if(meta.includes('nome')&&meta.includes('pacient'))s+=420;else if(near.includes('nome do paciente'))s+=260;else if(near.includes('nome')&&near.includes('pacient'))s+=190;else if(meta.includes('pacient'))s+=60;
   if(value&&/^[\p{L}][\p{L}\s.'’-]{1,119}$/u.test(value))s+=150;
   if(/busca|buscar|medic|observ|cpf|cns|idade|data|horario|dose|quantidade|posologia/.test(meta))s-=300;
 }else if(kind==='age'){
   if(meta.includes('idade'))s+=400;else if(near.includes('idade'))s+=180;if(/^\d{1,3}$/.test(value))s+=80;if(/dose|quantidade|item/.test(meta))s-=180;
 }else if(kind==='sex'){
   if(meta.includes('sexo'))s+=400;else if(near.includes('sexo'))s+=180;if(/^(m|f|masculino|feminino|homem|mulher)$/i.test(value))s+=80;
 }
 if(value)s+=20;if(el.tagName==='INPUT'&&(el.type==='text'||!el.type))s+=10;return s}
function bestField(kind){const ranked=controlsVisible().map(el=>({el,score:scoreField(el,kind)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);return ranked[0]?.el||null}
function fallbackName(){const list=controlsVisible();for(const el of list){if(el.tagName!=='INPUT'||(el.type&&el.type!=='text'))continue;const v=String(el.value||'').trim(),meta=baseLabel(el,d());if(v.length<2||v.length>120||!/^[\p{L}][\p{L}\s.'’-]+$/u.test(v))continue;if(/busca|buscar|medic|observ|endereco|cidade|mae|responsavel/.test(meta))continue;return v}const text=d()?.body?.innerText||'';const m=text.match(/PACIENTE\s*:\s*([^\n\r]{2,120})/i);return m?m[1].trim():''}
function field(kind){return bestField(kind)}
function readPatientName(){return String(field('name')?.value||fallbackName()||(!clearedSession?context?.patient?.name:'')||'').trim()}
function readValue(kind){return String(field(kind)?.value||(!clearedSession?context?.patient?.[kind==='age'?'age':'sex']:'')||'').trim()}
function setField(el,v){if(!el||v==null||v==='')return;try{if(el.tagName==='SELECT'){const n=norm(v),o=[...el.options].find(x=>norm(x.value)===n||norm(x.textContent).includes(n));el.value=o?o.value:v}else el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}catch{}}
function applyContext(){if(clearedSession)return;const p=context?.patient||{};if(p.name)patientLabel.textContent=p.name+(p.age?' · '+p.age+' a':'');setField(field('name'),p.name);setField(field('age'),p.age);setField(field('sex'),p.sex);if(p.status==='censo'){document.querySelector('input[name="dest"][value="censo"]').checked=true;sectorEl.classList.add('show');if(p.sector)sectorEl.value=p.sector}else if(p.status==='reavaliacao'){document.querySelector('input[name="dest"][value="reavaliacao"]').checked=true}}
function storageDump(){const out={};try{const ls=frame.contentWindow.localStorage;for(let i=0;i<ls.length;i++){const k=ls.key(i);if(!k||k.startsWith('crs-temp:')||k.startsWith('crs-presc-draft:'))continue;if(/presc|rascun|draft|pacient|receit|medic|item|form/.test(norm(k)))out[k]=ls.getItem(k)}}catch{}return out}
function restoreStorage(obj){if(!obj||typeof obj!=='object')return false;let changed=false;try{const ls=frame.contentWindow.localStorage;for(const[k,v]of Object.entries(obj)){if(k.startsWith('crs-temp:')||k.startsWith('crs-presc-draft:'))continue;if(ls.getItem(k)!==v){ls.setItem(k,v);changed=true}}}catch{}return changed}
function controls(){const doc=d();if(!doc)return[];return[...doc.querySelectorAll('input,textarea,select')].map((el,i)=>({i,id:el.id||'',name:el.name||'',tag:el.tagName,type:el.type||'',value:el.value,checked:!!el.checked,selected:el.tagName==='SELECT'?[...el.options].map((o,j)=>o.selected?j:null).filter(x=>x!==null):[]}))}
function restoreControls(list){const doc=d();if(!doc||!Array.isArray(list))return;const all=[...doc.querySelectorAll('input,textarea,select')];list.forEach(c=>{let el=c.id?doc.getElementById(c.id):null;if(!el&&c.name)try{el=doc.querySelector('[name="'+CSS.escape(c.name)+'"]')}catch{}if(!el)el=all[c.i];if(!el)return;try{if(el.type==='checkbox'||el.type==='radio')el.checked=!!c.checked;else if(el.tagName==='SELECT')[...el.options].forEach((o,j)=>o.selected=c.selected?.includes(j));else el.value=c.value??'';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}catch{}})}
function preview(){const doc=d();if(!doc)return'';for(const s of ['#print-area','#printArea','.print-area','.prescricao-preview','.prescription-preview','.preview-prescricao','[data-print-area]','main']){const e=doc.querySelector(s);if(e?.innerText?.trim().length>80)return e.innerText.trim().slice(0,12000)}return(doc.body?.innerText||'').trim().slice(0,12000)}
function patient(){return{name:readPatientName(),age:readValue('age'),sex:readValue('sex')}}
function snapshot(){return{version:7,savedAt:Date.now(),controls:controls(),localStorage:storageDump(),previewText:preview()}}
function destination(){return document.querySelector('input[name="dest"]:checked')?.value||''}
function localSave(){if(clearedSession)return;try{localStorage.setItem(draftKey,JSON.stringify(snapshot()));saveState.textContent='Prévia salva automaticamente neste dispositivo.';saveState.className='save-state ok'}catch{}}
function localLoad(){if(clearedSession)return null;try{return JSON.parse(localStorage.getItem(draftKey)||'null')}catch{return null}}
function setBusy(on){document.getElementById('save-preview').disabled=on;document.getElementById('save-final').disabled=on;topClear.disabled=on}
function requestSave(dest='salvar',sec=''){const p=patient();if(!p.name)return Promise.reject(new Error('Não consegui localizar o campo Nome do paciente. Atualize a página e tente novamente.'));const snap=snapshot();try{localStorage.setItem(draftKey,JSON.stringify(snap))}catch{}const requestId=uid();return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{pending.delete(requestId);reject(new Error('A Central CRS não confirmou o salvamento.'))},10000);pending.set(requestId,{resolve,reject,timeout});try{post({type:'CRS_PRESCRIPTION_SAVE_V2',requestId,patientId,patient:p,destination:dest,sector:sec,snapshot:snap})}catch(e){clearTimeout(timeout);pending.delete(requestId);reject(e)}})}
async function centralSave(dest='salvar',sec='',show=true){setBusy(true);setStatus('Salvando…');try{const result=await requestSave(dest,sec);setStatus(dest==='salvar'?'Prévia salva':'Versão final salva','ok');const p=patient();if(p.name)patientLabel.textContent=p.name+(p.age?' · '+p.age+' a':'');saveState.textContent='Confirmado pela Central CRS às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});saveState.className='save-state ok';if(show)toast(dest==='salvar'?'Prévia salva na Central CRS.':'Prescrição salva e destino aplicado.');return result||true}catch(e){setStatus('Falha ao salvar','err');saveState.textContent=e.message||'Falha ao salvar.';saveState.className='save-state err';toast(e.message||'Falha ao salvar.',true);return false}finally{setBusy(false)}}
function buttons(doc){return[...doc.querySelectorAll('button,.btn,input[type="button"],input[type="submit"]')]}
function buttonText(el){return norm(el.textContent||el.value||el.getAttribute('aria-label')||'')}
function findButton(doc,test){return buttons(doc).find(el=>test(buttonText(el)))||null}
function forceTop(){try{frame.contentWindow.scrollTo(0,0)}catch{}try{const doc=d();if(doc?.documentElement)doc.documentElement.scrollTop=0;if(doc?.body)doc.body.scrollTop=0;if(doc?.scrollingElement)doc.scrollingElement.scrollTop=0}catch{}}
function clearIntegrationDrafts(){clearTimeout(timer);try{localStorage.removeItem(draftKey)}catch{}try{const ls=frame.contentWindow.localStorage,remove=[];for(let i=0;i<ls.length;i++){const k=ls.key(i),n=norm(k);if(!k)continue;if(k.startsWith('crs-temp:')||k.startsWith('crs-presc-draft:')||/rascun|draft|current.?presc|last.?presc|presc.?atual|pacient.?atual/.test(n))remove.push(k)}remove.forEach(k=>ls.removeItem(k))}catch{}try{frame.contentWindow.sessionStorage.clear()}catch{}}
async function clearAll(){if(clearBusy)return;if(!confirm('Limpar toda a prescrição?\n\nIsso apagará os dados preenchidos e os itens desta prescrição. As prescrições já salvas no histórico não serão apagadas.'))return;clearBusy=true;clearedSession=true;restored=true;centralSnapshot=null;context=null;document.querySelectorAll('input[name="dest"]').forEach(r=>r.checked=false);sectorEl.classList.remove('show');patientLabel.textContent='Urgência e Emergência';clearIntegrationDrafts();const doc=d(),original=doc?findButton(doc,t=>t.includes('limpar tudo')):null;if(original){bypassClear=original;let oldConfirm=null;try{oldConfirm=frame.contentWindow.confirm;frame.contentWindow.confirm=()=>true}catch{}try{original.click()}catch{}setTimeout(()=>{try{if(oldConfirm)frame.contentWindow.confirm=oldConfirm}catch{}},250)}setStatus('Nova prescrição','');saveState.textContent='Prescrição limpa.';saveState.className='save-state ok';setTimeout(()=>{try{frame.contentWindow.location.reload()}catch{}setTimeout(forceTop,350);clearBusy=false},180)}
function hookActions(){const doc=d();if(!doc)return;const all=buttons(doc);const print=all.find(el=>buttonText(el).includes('imprimir'))||null;const review=all.find(el=>buttonText(el).includes('revisar')&&!buttonText(el).includes('imprimir'))||null;const clear=all.find(el=>buttonText(el).includes('limpar tudo'))||null;
 if(review&&!review.dataset.crsSaveHook){review.dataset.crsSaveHook='1';review.addEventListener('click',async e=>{if(bypass===review){bypass=null;return}e.preventDefault();e.stopImmediatePropagation();if(await centralSave('salvar','',false)){bypass=review;setTimeout(()=>review.click(),70)}},true)}
 if(print&&!print.dataset.crsSaveHook){print.dataset.crsSaveHook='1';print.addEventListener('click',async e=>{if(bypass===print){bypass=null;return}const dest=destination();if(!dest){e.preventDefault();e.stopImmediatePropagation();toast('Selecione Alta, Reavaliação ou Censo antes de imprimir.',true);return}e.preventDefault();e.stopImmediatePropagation();if(await centralSave(dest,dest==='censo'?sectorEl.value:'',false)){bypass=print;setTimeout(()=>print.click(),90)}},true)}
 if(clear&&!clear.dataset.crsClearHook){clear.dataset.crsClearHook='1';clear.addEventListener('click',e=>{if(bypassClear===clear){bypassClear=null;return}e.preventDefault();e.stopImmediatePropagation();clearAll()},true)}
 if(!doc.body.dataset.crsAuto){doc.body.dataset.crsAuto='1';const schedule=()=>{clearTimeout(timer);timer=setTimeout(localSave,1400)};doc.addEventListener('input',schedule,true);doc.addEventListener('change',schedule,true)}
}
document.querySelectorAll('input[name="dest"]').forEach(r=>r.addEventListener('change',()=>sectorEl.classList.toggle('show',destination()==='censo')));
topClear.onclick=clearAll;
document.getElementById('save-preview').onclick=()=>centralSave('salvar','',true);
document.getElementById('save-final').onclick=()=>{const dest=destination();if(!dest)return toast('Selecione o destino do paciente.',true);centralSave(dest,dest==='censo'?sectorEl.value:'',true)};
function bestSnapshot(){const local=localLoad(),central=centralSnapshot;if(local&&central)return Number(local.savedAt||0)>Number(central.savedAt||0)?local:central;return local||central||null}
function setup(){if(clearedSession){hookActions();forceTop();return}const snap=bestSnapshot();if(snap&&!restored){const changed=restoreStorage(snap.localStorage);if(changed&&!reloaded){reloaded=true;frame.contentWindow.location.reload();return}restoreControls(snap.controls);restored=true}applyContext();hookActions();const p=patient();if(p.name)patientLabel.textContent=p.name+(p.age?' · '+p.age+' a':'')}
frame.addEventListener('load',()=>{setTimeout(setup,260);setTimeout(setup,850);setTimeout(hookActions,1600);if(clearedSession)setTimeout(forceTop,280)});
window.addEventListener('message',e=>{if(!e.data||typeof e.data!=='object')return;if(returnOrigin&&e.origin!==returnOrigin)return;const target=targetWindow();if(target&&e.source!==target)return;if(e.data.type==='CRS_PRESCRIPTION_CONTEXT_V2'&&e.data.patientId===patientId){context=e.data.context||null;centralSnapshot=e.data.snapshot||null;setStatus(e.data.error?'Contexto parcial':'Conectado à Central CRS',e.data.error?'err':'ok');setTimeout(setup,120);return}if(e.data.type==='CRS_PRESCRIPTION_SAVE_RESULT'){const p=pending.get(String(e.data.requestId||''));if(!p)return;clearTimeout(p.timeout);pending.delete(String(e.data.requestId||''));e.data.ok?p.resolve(e.data):p.reject(new Error(e.data.error||'Falha ao salvar.'))}});
try{post({type:'CRS_PRESCRIPTION_READY_V2',patientId})}catch(e){setStatus('Modo isolado','err');toast(e.message,true)}
})();
</script>
</body>
</html>
