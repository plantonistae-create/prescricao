<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f8fc">
<title>Prescrição · CRS Coophavila</title>
<style>
:root{--bg:#f4f8fc;--panel:#fff;--line:#d6e2ed;--ink:#1c2d3d;--dim:#687a89;--blue:#1675d1;--blue-soft:#eaf4fe;--red:#d93038;--amber:#e59617;--green:#29966a}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{overflow:hidden;display:flex;flex-direction:column}.bar{flex:0 0 56px;display:flex;align-items:center;gap:11px;padding:7px 15px;border-bottom:1px solid var(--line);background:#fff;position:relative;z-index:10;box-shadow:0 3px 14px rgba(34,75,111,.05)}.emblem{width:34px;height:34px;border-radius:9px;background:var(--blue);display:grid;place-items:center;font-weight:900;color:#fff;box-shadow:0 0 0 3px rgba(22,117,209,.10)}.brand{min-width:190px}.brand b{display:block;font-size:14px;color:#17314a}.brand span{display:block;font-size:9px;color:#5f7487;margin-top:2px;text-transform:uppercase;letter-spacing:.09em}.spacer{flex:1}.status{font-size:11px;color:var(--dim);white-space:nowrap}.status.ok{color:#237e59}.status.err{color:#ba2731}.workspace{flex:1;min-height:0;display:flex;flex-direction:column}.frame{flex:1;min-height:0;width:100%;border:0;background:#fff;display:block}.flow{flex:0 0 auto;background:#fff;border-top:1px solid #cbdbe8;box-shadow:0 -6px 20px rgba(34,75,111,.07);padding:10px 15px calc(10px + env(safe-area-inset-bottom));z-index:12}.flow-inner{max-width:1250px;margin:0 auto;display:grid;grid-template-columns:auto minmax(330px,1fr) auto;gap:12px;align-items:center}.flow-title{min-width:155px}.flow-title b{font-size:12px;color:#17314a;display:block}.flow-title span{font-size:10px;color:var(--dim);display:block;margin-top:2px}.destinations{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}.choice{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid #cedbe7;border-radius:8px;background:#f9fbfd;font-size:12px;font-weight:700;color:#405465;cursor:pointer;white-space:nowrap}.choice input{margin:0;accent-color:var(--blue)}.choice:has(input:checked){border-color:#79afe0;background:var(--blue-soft);color:#145f9f}.choice.alta:has(input:checked){border-color:#83c6aa;background:#edf9f4;color:#237c57}.choice.reav:has(input:checked){border-color:#efc46f;background:#fff8e9;color:#95600e}.choice.censo:has(input:checked){border-color:#79afe0;background:#eaf4fe;color:#145f9f}.sector-wrap{display:none;align-items:center;gap:6px}.sector-wrap.show{display:flex}.sector-wrap label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#667988;font-weight:800}.sector-wrap select{height:34px;border:1px solid #c8d8e5;border-radius:7px;background:#fff;color:#263a4a;padding:0 9px;min-width:175px}.flow-actions{display:flex;gap:7px;align-items:center}.flow-btn{border:1px solid #c9d8e4;border-radius:8px;background:#fff;color:#294052;padding:9px 11px;font-weight:760;font-size:12px;cursor:pointer;white-space:nowrap}.flow-btn:hover{background:#f6faff}.flow-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.flow-btn:disabled{opacity:.55;cursor:wait}.save-state{font-size:10px;color:var(--dim);margin-top:4px}.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;border:1px solid #cbdbe8;padding:10px 13px;border-radius:9px;z-index:90;opacity:0;pointer-events:none;transition:.18s;color:#263b4c;font-size:12px;box-shadow:0 12px 34px rgba(35,73,105,.16);max-width:min(460px,90vw);text-align:center}.toast.show{opacity:1}.toast.err{border-color:#e5a3a8;color:#b4242e;background:#fff7f7}
@media(max-width:900px){.flow-inner{grid-template-columns:1fr auto}.flow-title{grid-column:1/-1;display:flex;align-items:center;gap:8px}.flow-title span{margin:0}.destinations{align-items:flex-start}.flow-actions{align-self:end}}
@media(max-width:650px){.bar{flex-basis:52px;padding:6px 10px}.emblem{width:30px;height:30px}.brand{min-width:0}.brand b{font-size:13px}.brand span,.status{display:none}.flow{padding:8px 9px calc(8px + env(safe-area-inset-bottom))}.flow-inner{display:flex;flex-direction:column;align-items:stretch;gap:7px}.flow-title{display:none}.destinations{gap:5px}.choice{flex:1;justify-content:center;padding:7px 6px;font-size:11px}.sector-wrap{width:100%;order:2}.sector-wrap select{flex:1;min-width:0}.flow-actions{width:100%;order:3}.flow-btn{flex:1;padding:8px 7px;font-size:11px}.save-state{display:none}.toast{bottom:calc(120px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<header class="bar">
  <div class="emblem">+</div>
  <div class="brand"><b>CRS Coophavila · Prescrição</b><span id="patient-label">Urgência e Emergência</span></div>
  <div class="spacer"></div>
  <span class="status" id="status">Conectando à Central CRS…</span>
</header>
<div class="workspace"><iframe id="presc" class="frame" title="Prescrição"></iframe></div>
<footer class="flow" id="flow">
  <div class="flow-inner">
    <div class="flow-title"><b>Destino após a prescrição</b><span>Aplicado ao finalizar ou imprimir</span><div class="save-state" id="save-state">Autossalvamento local ativo.</div></div>
    <div class="destinations">
      <label class="choice alta"><input type="radio" name="crs-dest" value="alta">Alta</label>
      <label class="choice reav"><input type="radio" name="crs-dest" value="reavaliacao">Reavaliação</label>
      <label class="choice censo"><input type="radio" name="crs-dest" value="censo">Censo</label>
      <div class="sector-wrap" id="sector-wrap"><label>Setor</label><select id="sector"><option value="emergencia">Emergência</option><option value="infantil">Enfermaria Infantil</option><option value="feminina">Enfermaria Feminina</option><option value="masculina">Enfermaria Masculina</option></select></div>
    </div>
    <div class="flow-actions"><button type="button" class="flow-btn" id="save-preview">Salvar prévia</button><button type="button" class="flow-btn primary" id="save-final">Salvar sem imprimir</button></div>
  </div>
</footer>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const qs=new URLSearchParams(location.search);
const patientId=qs.get('patientId')||(crypto.randomUUID?crypto.randomUUID():'p-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const returnOrigin=qs.get('returnOrigin')||'';
const frame=document.getElementById('presc'),statusEl=document.getElementById('status'),patientLabel=document.getElementById('patient-label'),saveState=document.getElementById('save-state');
const draftKey='crs-temp:'+patientId;
const pending=new Map();
let context=null,centralSnapshot=null,loaded=false,timer=null,bypass=null,observer=null;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const uid=()=>crypto.randomUUID?crypto.randomUUID():'r-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function toast(msg,err=false){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='toast',2600)}
function setStatus(text,kind=''){statusEl.textContent=text;statusEl.className='status '+kind}
function post(msg){if(!window.opener)throw new Error('Abra a prescrição pela Central CRS para salvar.');window.opener.postMessage(msg,returnOrigin||'*')}
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch{return null}}
function label(el,d){let s=(el.placeholder||'')+' '+(el.name||'')+' '+(el.id||'')+' '+(el.getAttribute('aria-label')||'');if(el.id){const l=d.querySelector('label[for="'+CSS.escape(el.id)+'"]');if(l)s+=' '+l.textContent}if(el.closest('label'))s+=' '+el.closest('label').textContent;return norm(s)}
function field(words){const d=doc();return d?[...d.querySelectorAll('input,textarea,select')].find(el=>words.some(w=>label(el,d).includes(w)))||null:null}
function setField(el,v){if(!el||v==null||v==='')return;try{if(el.tagName==='SELECT'){const n=norm(v),o=[...el.options].find(x=>norm(x.value)===n||norm(x.textContent).includes(n));el.value=o?o.value:v}else el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}catch{}}
function applyContext(){const p=context?.patient||{};if(p.name)patientLabel.textContent=p.name+(p.age?' · '+p.age+' a':'');setField(field(['nome do paciente','nome paciente','paciente']),p.name);setField(field(['idade']),p.age);setField(field(['sexo']),p.sex)}
function storageDump(){const out={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||k.startsWith('crs-temp:')||k.startsWith('crs-presc-draft:'))continue;if(/presc|rascun|draft|pacient|receit|medic|item|form/.test(norm(k)))out[k]=localStorage.getItem(k)}}catch{}return out}
function restoreStorage(obj){if(!obj||typeof obj!=='object')return;try{for(const [k,v] of Object.entries(obj)){if(k.startsWith('crs-temp:')||k.startsWith('crs-presc-draft:'))continue;localStorage.setItem(k,v)}}catch{}}
function controls(){const d=doc();if(!d)return[];return [...d.querySelectorAll('input,textarea,select')].map((el,i)=>({i,id:el.id||'',name:el.name||'',tag:el.tagName,type:el.type||'',value:el.value,checked:!!el.checked,selected:el.tagName==='SELECT'?[...el.options].map((o,j)=>o.selected?j:null).filter(x=>x!==null):[]}))}
function restoreControls(list){const d=doc();if(!d||!Array.isArray(list))return;const all=[...d.querySelectorAll('input,textarea,select')];list.forEach(c=>{let el=c.id?d.getElementById(c.id):null;if(!el&&c.name)el=d.querySelector('[name="'+CSS.escape(c.name)+'"]');if(!el)el=all[c.i];if(!el)return;try{if(el.type==='checkbox'||el.type==='radio')el.checked=!!c.checked;else if(el.tagName==='SELECT')[...el.options].forEach((o,j)=>o.selected=c.selected?.includes(j));else el.value=c.value??'';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}catch{}})}
function preview(){const d=doc();if(!d)return'';for(const s of ['#print-area','#printArea','.print-area','.prescricao-preview','.prescription-preview','.preview-prescricao','[data-print-area]','main']){const e=d.querySelector(s);if(e?.innerText?.trim().length>80)return e.innerText.trim().slice(0,12000)}return(d.body?.innerText||'').trim().slice(0,12000)}
function patient(){return{name:(field(['nome do paciente','nome paciente','paciente'])?.value||context?.patient?.name||'').trim(),age:String(field(['idade'])?.value||context?.patient?.age||'').trim(),sex:String(field(['sexo'])?.value||context?.patient?.sex||'').trim()}}
function snapshot(){return{version:4,savedAt:Date.now(),controls:controls(),localStorage:storageDump(),previewText:preview()}}
function localSave(show=false){try{const s=snapshot();localStorage.setItem(draftKey,JSON.stringify(s));saveState.textContent='Prévia local salva às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(show)toast('Prévia preservada neste dispositivo.');return s}catch{if(show)toast('Não foi possível preservar a prévia local.',true);return null}}
function localLoad(){try{return JSON.parse(localStorage.getItem(draftKey)||'null')}catch{return null}}
function destination(){return document.querySelector('input[name="crs-dest"]:checked')?.value||''}
function sector(){return document.getElementById('sector').value}
function syncDestination(){document.getElementById('sector-wrap').classList.toggle('show',destination()==='censo')}
document.querySelectorAll('input[name="crs-dest"]').forEach(r=>r.addEventListener('change',syncDestination));
function setDestinationFromContext(){const p=context?.patient;if(!p)return;if(p.status==='censo')document.querySelector('input[value="censo"]').checked=true;else if(p.status==='reavaliacao')document.querySelector('input[value="reavaliacao"]').checked=true;if(p.sector&&[...document.getElementById('sector').options].some(o=>o.value===p.sector))document.getElementById('sector').value=p.sector;syncDestination()}
function setBusy(busy){document.getElementById('save-preview').disabled=busy;document.getElementById('save-final').disabled=busy}
function requestSave(dest='salvar',sec=''){
  const p=patient();if(!p.name)return Promise.reject(new Error('Informe o nome do paciente antes de salvar.'));
  const snap=snapshot();try{localStorage.setItem(draftKey,JSON.stringify(snap))}catch{}
  const requestId=uid();
  return new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>{pending.delete(requestId);reject(new Error('A Central não confirmou o salvamento. Verifique se ela continua aberta.'))},9000);
    pending.set(requestId,{resolve,reject,timeout});
    try{post({type:'CRS_PRESCRIPTION_SAVE_V2',requestId,patientId,patient:p,destination:dest,sector:sec,snapshot:snap})}catch(e){clearTimeout(timeout);pending.delete(requestId);reject(e)}
  })
}
async function centralSave(dest='salvar',sec='',show=true){setBusy(true);setStatus('Salvando…');try{await requestSave(dest,sec);setStatus(dest==='salvar'?'Prévia salva na Central CRS':'Prescrição final salva','ok');saveState.textContent='Confirmado pela Central às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(show)toast(dest==='salvar'?'Prévia salva na Central CRS.':'Prescrição salva e destino aplicado.');return true}catch(e){setStatus('Falha ao salvar','err');toast(e.message||'Falha ao salvar.',true);return false}finally{setBusy(false)}}
document.getElementById('save-preview').onclick=()=>centralSave('salvar','',true);
document.getElementById('save-final').onclick=async()=>{const d=destination();if(!d)return toast('Selecione Alta, Reavaliação ou Censo.',true);await centralSave(d,d==='censo'?sector():'',true)};
function actionButton(d,terms){return [...d.querySelectorAll('button,.btn,input[type="button"],input[type="submit"],a[role="button"]')].find(el=>terms.some(t=>norm(el.textContent||el.value||el.getAttribute('aria-label')).includes(t)))||null}
function hookButtons(){const d=doc();if(!d)return;const review=actionButton(d,['revisar']);const print=actionButton(d,['imprimir pdf','imprimir']);
  if(review&&!review.dataset.crsHook){review.dataset.crsHook='1';review.addEventListener('click',async e=>{if(bypass===review){bypass=null;return}e.preventDefault();e.stopImmediatePropagation();if(await centralSave('salvar','',false)){bypass=review;review.click()}},true)}
  if(print&&!print.dataset.crsHook){print.dataset.crsHook='1';print.addEventListener('click',async e=>{if(bypass===print){bypass=null;return}e.preventDefault();e.stopImmediatePropagation();const dest=destination();if(!dest){toast('Selecione o destino antes de imprimir.',true);document.getElementById('flow').scrollIntoView({behavior:'smooth',block:'end'});return}if(await centralSave(dest,dest==='censo'?sector():'',false)){bypass=print;print.click()}},true)}
}
function setupInner(){const d=doc();if(!d)return;applyContext();const snap=chooseSnapshot();if(snap?.controls)restoreControls(snap.controls);applyContext();hookButtons();
  if(!d.body.dataset.crsAuto){d.body.dataset.crsAuto='1';const schedule=()=>{clearTimeout(timer);timer=setTimeout(()=>localSave(false),1200)};d.addEventListener('input',schedule,true);d.addEventListener('change',schedule,true)}
  observer?.disconnect();observer=new MutationObserver(()=>{clearTimeout(hookButtons.t);hookButtons.t=setTimeout(hookButtons,120)});observer.observe(d.body,{childList:true,subtree:true});
}
function chooseSnapshot(){const local=localLoad(),central=centralSnapshot;if(local&&central)return Number(local.savedAt||0)>Number(central.savedAt||0)?local:central;return local||central||null}
function loadFrame(){if(loaded)return;loaded=true;const snap=chooseSnapshot();if(snap?.localStorage)restoreStorage(snap.localStorage);frame.src='./index.html?crs_embed=1&crs_patient='+encodeURIComponent(patientId)}
frame.addEventListener('load',()=>{setTimeout(setupInner,280);setTimeout(setupInner,850);setTimeout(hookButtons,1800)});
window.addEventListener('message',e=>{
  if(e.source!==window.opener||!e.data||typeof e.data!=='object')return;if(returnOrigin&&e.origin!==returnOrigin)return;
  if(e.data.type==='CRS_PRESCRIPTION_CONTEXT_V2'&&e.data.patientId===patientId){context=e.data.context||null;centralSnapshot=e.data.snapshot||null;if(e.data.error)setStatus('Contexto parcial','err');else setStatus('Conectado à Central CRS','ok');setDestinationFromContext();loadFrame();return}
  if(e.data.type==='CRS_PRESCRIPTION_SAVE_RESULT'){const p=pending.get(String(e.data.requestId||''));if(!p)return;clearTimeout(p.timeout);pending.delete(String(e.data.requestId||''));e.data.ok?p.resolve(e.data):p.reject(new Error(e.data.error||'Falha ao salvar.'))}
});
try{post({type:'CRS_PRESCRIPTION_READY_V2',patientId})}catch(e){setStatus('Abra pela Central CRS','err');toast(e.message,true);loadFrame()}
setTimeout(()=>{if(!loaded){setStatus(window.opener?'Conectando…':'Modo isolado','');loadFrame()}},1600);
})();
</script>
</body>
</html>
