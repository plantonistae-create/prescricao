<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prescrição · CRS Coophavila</title>
<style>
:root{--bg:#11161c;--line:#303944;--ink:#f5f7fa;--dim:#9da8b5;--red:#d93636}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{overflow:hidden}.bar{height:58px;display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#191f27,#11171d);position:relative;z-index:10}.emblem{width:34px;height:34px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-weight:900;color:#fff;box-shadow:0 0 0 3px rgba(217,54,54,.14)}.brand{min-width:190px}.brand b{display:block;font-size:14px}.brand span{display:block;font-size:10px;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.08em}.spacer{flex:1}.status{font-size:11px;color:var(--dim);white-space:nowrap}.frame{width:100%;height:calc(100% - 58px);border:0;background:#fff}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#202833;border:1px solid var(--line);padding:11px 14px;border-radius:9px;z-index:80;opacity:0;pointer-events:none;transition:.18s;color:var(--ink);font-size:13px;box-shadow:0 12px 35px rgba(0,0,0,.35)}.toast.show{opacity:1}.toast.err{border-color:rgba(217,54,54,.6);color:#ffc2c2}@media(max-width:720px){.bar{height:54px;padding:7px 10px}.emblem{width:30px;height:30px}.brand{min-width:0}.brand b{font-size:13px}.brand span,.status{display:none}.frame{height:calc(100% - 54px)}}
</style>
</head>
<body>
<header class="bar"><div class="emblem">+</div><div class="brand"><b>CRS Coophavila · Prescrição</b><span id="patient-label">Urgência e Emergência</span></div><div class="spacer"></div><span class="status" id="status">Conectando à Central CRS…</span></header>
<iframe id="presc" class="frame" src="./index.html?crs_embed=1" title="Prescrição"></iframe>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const qs=new URLSearchParams(location.search),patientId=qs.get('patientId')||(crypto.randomUUID?crypto.randomUUID():'p-'+Date.now()),returnOrigin=qs.get('returnOrigin')||'';
const frame=document.getElementById('presc'),statusEl=document.getElementById('status'),patientLabel=document.getElementById('patient-label');
const draftKey='crs-temp:'+patientId;
let context=null,pendingSnapshot=null,restored=false,timer=null,bypass=null;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function toast(msg,err=false){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='toast',2200)}
function post(msg){if(!window.opener){statusEl.textContent='Central CRS não está aberta';return}try{window.opener.postMessage(msg,returnOrigin||'*')}catch{window.opener.postMessage(msg,'*')}}
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch{return null}}
function label(el,d){let s=(el.placeholder||'')+' '+(el.name||'')+' '+(el.id||'')+' '+(el.getAttribute('aria-label')||'');if(el.id){const l=d.querySelector('label[for="'+CSS.escape(el.id)+'"]');if(l)s+=' '+l.textContent}if(el.closest('label'))s+=' '+el.closest('label').textContent;return norm(s)}
function field(words){const d=doc();return d?[...d.querySelectorAll('input,textarea,select')].find(el=>words.some(w=>label(el,d).includes(w)))||null:null}
function setField(el,v){if(!el||v==null||v==='')return;try{if(el.tagName==='SELECT'){const n=norm(v),o=[...el.options].find(x=>norm(x.value)===n||norm(x.textContent).includes(n));el.value=o?o.value:v}else el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}catch{}}
function applyContext(){const p=context?.patient||{};if(p.name)patientLabel.textContent=p.name+(p.age?' · '+p.age+' a':'');setField(field(['nome do paciente','nome paciente','paciente']),p.name);setField(field(['idade']),p.age);setField(field(['sexo']),p.sex)}
function storageDump(){const out={};try{const ls=frame.contentWindow.localStorage;for(let i=0;i<ls.length;i++){const k=ls.key(i);if(!k||k.startsWith('crs-temp:')||k.startsWith('crs-presc-draft:'))continue;if(/presc|rascun|draft|pacient|receit|medic|item|form/.test(norm(k)))out[k]=ls.getItem(k)}}catch{}return out}
function restoreStorage(obj){if(!obj)return false;let changed=false;try{const ls=frame.contentWindow.localStorage;for(const [k,v] of Object.entries(obj)){if(k.startsWith('crs-temp:')||k.startsWith('crs-presc-draft:'))continue;if(ls.getItem(k)!==v){ls.setItem(k,v);changed=true}}}catch{}return changed}
function controls(){const d=doc();if(!d)return[];return [...d.querySelectorAll('input,textarea,select')].filter(el=>!el.closest('#crs-destination-panel')).map((el,i)=>({i,id:el.id||'',name:el.name||'',tag:el.tagName,type:el.type||'',value:el.value,checked:!!el.checked,selected:el.tagName==='SELECT'?[...el.options].map((o,j)=>o.selected?j:null).filter(x=>x!==null):[]}))}
function restoreControls(list){const d=doc();if(!d||!Array.isArray(list))return;const all=[...d.querySelectorAll('input,textarea,select')].filter(el=>!el.closest('#crs-destination-panel'));list.forEach(c=>{let el=c.id?d.getElementById(c.id):null;if(!el&&c.name)el=d.querySelector('[name="'+CSS.escape(c.name)+'"]');if(!el)el=all[c.i];if(!el)return;try{if(el.type==='checkbox'||el.type==='radio')el.checked=!!c.checked;else if(el.tagName==='SELECT')[...el.options].forEach((o,j)=>o.selected=c.selected?.includes(j));else el.value=c.value??'';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}catch{}})}
function preview(){const d=doc();if(!d)return'';for(const s of ['#print-area','#printArea','.print-area','.prescricao-preview','.preview-prescricao','[data-print-area]','main']){const e=d.querySelector(s);if(e?.innerText?.trim().length>80)return e.innerText.trim().slice(0,12000)}return(d.body?.innerText||'').trim().slice(0,12000)}
function patient(){return{name:(field(['nome do paciente','nome paciente','paciente'])?.value||context?.patient?.name||'').trim(),age:String(field(['idade'])?.value||context?.patient?.age||'').trim(),sex:String(field(['sexo'])?.value||context?.patient?.sex||'').trim()}}
function snapshot(){return{version:3,savedAt:Date.now(),controls:controls(),localStorage:storageDump(),previewText:preview()}}
function destination(){return doc()?.querySelector('#crs-destination-panel input[name="crs-dest"]:checked')?.value||''}
function sector(){return doc()?.querySelector('#crs-sector')?.value||''}
function localSave(show=false){try{localStorage.setItem(draftKey,JSON.stringify(snapshot()));statusEl.textContent='Prévia salva automaticamente';if(show)toast('Prévia salva neste dispositivo.')}catch{if(show)toast('Não foi possível salvar a prévia.',true)}}
function localLoad(){try{return JSON.parse(localStorage.getItem(draftKey)||'null')}catch{return null}}
function centralSave(dest='salvar',sec='',show=true){const p=patient();if(!p.name){toast('Informe o nome do paciente antes de salvar.',true);return false}const snap=snapshot();post({type:'CRS_PRESCRIPTION_SAVED',patientId,patient:p,destination:dest,sector:sec,snapshot:snap});try{localStorage.setItem(draftKey,JSON.stringify(snap))}catch{}statusEl.textContent=dest==='salvar'?'Prévia enviada à Central CRS':'Versão final enviada à Central CRS';if(show)toast(dest==='salvar'?'Prévia salva na Central CRS.':'Prescrição salva e destino aplicado.');return true}
function actionButton(d,terms){return [...d.querySelectorAll('button,.btn,input[type="button"],input[type="submit"]')].find(el=>terms.some(t=>norm(el.textContent||el.value||el.getAttribute('aria-label')).includes(t)))||null}
function inject(){const d=doc();if(!d)return;if(!d.getElementById('crs-flow-style')){const s=d.createElement('style');s.id='crs-flow-style';s.textContent=`#crs-destination-panel{margin:18px 0 8px;border:1px solid #c6cdd4;border-left:5px solid #c92c34;background:#fff;border-radius:7px;padding:15px 16px;box-shadow:0 3px 12px rgba(32,43,54,.06)}#crs-destination-panel .crs-title{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.055em;color:#8f1e28;font-size:14px;margin-bottom:4px}#crs-destination-panel .crs-help{font-size:11.5px;color:#67727c;margin-bottom:12px}.crs-dest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.crs-choice{border:1px solid #c7cfd6;border-radius:6px;padding:10px 11px;display:flex;gap:8px;align-items:center;background:#f8fafb;cursor:pointer;font-size:12.5px;font-weight:600}.crs-choice:has(input:checked){border-color:#b92832;background:#fff0f1;color:#8d1d26}.crs-choice input{accent-color:#b92832}.crs-sector-wrap{display:none;margin-top:10px}.crs-sector-wrap.show{display:block}.crs-sector-wrap label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#68737d;font-weight:700;margin-bottom:4px}.crs-sector-wrap select{width:100%;padding:9px;border:1px solid #c7cfd6;border-radius:5px;background:#fff}.crs-save-row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:12px;flex-wrap:wrap}.crs-save-status{margin-right:auto;font-size:11px;color:#75818c}.crs-save-btn{font-family:'Barlow Semi Condensed',sans-serif;border-radius:4px;border:1px solid #687581;background:#fff;color:#32414d;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:11.5px;padding:8px 12px;cursor:pointer}.crs-save-btn.final{background:#202b35;color:#fff;border-color:#202b35}@media(max-width:700px){.crs-dest-grid{grid-template-columns:1fr}.crs-save-row{justify-content:stretch}.crs-save-btn{flex:1}.crs-save-status{width:100%}}`;d.head.appendChild(s)}
let panel=d.getElementById('crs-destination-panel');if(!panel){panel=d.createElement('section');panel.id='crs-destination-panel';panel.innerHTML=`<div class="crs-title">Destino após a prescrição</div><div class="crs-help">Selecione para onde o paciente irá quando esta versão for finalizada.</div><div class="crs-dest-grid"><label class="crs-choice"><input type="radio" name="crs-dest" value="alta"> Alta</label><label class="crs-choice"><input type="radio" name="crs-dest" value="reavaliacao"> Reavaliação</label><label class="crs-choice"><input type="radio" name="crs-dest" value="censo"> Censo</label></div><div class="crs-sector-wrap" id="crs-sector-wrap"><label>Setor no Censo</label><select id="crs-sector"><option value="emergencia">Emergência</option><option value="infantil">Enfermaria Infantil</option><option value="feminina">Enfermaria Feminina</option><option value="masculina">Enfermaria Masculina</option></select></div><div class="crs-save-row"><span class="crs-save-status" id="crs-save-status">Prévia protegida por autossalvamento.</span><button type="button" class="crs-save-btn" id="crs-save-preview">Salvar prévia</button><button type="button" class="crs-save-btn final" id="crs-save-final">Salvar sem imprimir</button></div>`;const footer=d.querySelector('.footer-actions')||actionButton(d,['imprimir pdf','imprimir'])?.parentElement||d.querySelector('main')||d.body;if(footer!==d.body)footer.parentNode.insertBefore(panel,footer);else d.body.appendChild(panel)}
const sw=d.getElementById('crs-sector-wrap'),sync=()=>sw?.classList.toggle('show',destination()==='censo');d.querySelectorAll('#crs-destination-panel input[name="crs-dest"]').forEach(r=>r.onchange=sync);sync();d.getElementById('crs-save-preview').onclick=()=>centralSave('salvar','',true);d.getElementById('crs-save-final').onclick=()=>{const x=destination();if(!x)return toast('Selecione Alta, Reavaliação ou Censo.',true);centralSave(x,x==='censo'?sector():'',true)};
const review=actionButton(d,['revisar']),print=actionButton(d,['imprimir pdf','imprimir']);if(review&&!review.dataset.crsHook){review.dataset.crsHook='1';review.addEventListener('click',e=>{if(bypass===review){bypass=null;return}e.preventDefault();e.stopImmediatePropagation();localSave(false);bypass=review;setTimeout(()=>review.click(),80)},true)}if(print&&!print.dataset.crsHook){print.dataset.crsHook='1';print.addEventListener('click',e=>{if(bypass===print){bypass=null;return}const x=destination();if(!x){e.preventDefault();e.stopImmediatePropagation();toast('Selecione o destino antes de imprimir.',true);panel.scrollIntoView({behavior:'smooth',block:'center'});return}e.preventDefault();e.stopImmediatePropagation();if(!centralSave(x,x==='censo'?sector():'',false))return;bypass=print;setTimeout(()=>print.click(),160)},true)}
if(!d.body.dataset.crsAuto){d.body.dataset.crsAuto='1';const schedule=()=>{clearTimeout(timer);timer=setTimeout(()=>{localSave(false);const st=d.getElementById('crs-save-status');if(st)st.textContent='Prévia salva automaticamente.'},1500)};d.addEventListener('input',e=>{if(!e.target?.closest?.('#crs-destination-panel'))schedule()},true);d.addEventListener('change',e=>{if(!e.target?.closest?.('#crs-destination-panel'))schedule()},true)}}
frame.addEventListener('load',()=>setTimeout(()=>{const snap=pendingSnapshot||localLoad();if(snap&&!restored){restored=true;const changed=restoreStorage(snap.localStorage);if(changed){frame.addEventListener('load',()=>setTimeout(()=>{restoreControls(snap.controls);applyContext();inject()},260),{once:true});frame.contentWindow.location.reload();return}restoreControls(snap.controls)}applyContext();inject()},300));
window.addEventListener('message',e=>{if(e.source!==window.opener||!e.data)return;if(returnOrigin&&e.origin!==returnOrigin)return;if(e.data.type==='CRS_PRESCRIPTION_CONTEXT'){context=e.data.context||null;pendingSnapshot=e.data.snapshot||null;statusEl.textContent='Conectado à Central CRS';setTimeout(()=>{applyContext();inject()},180)}});
post({type:'CRS_PRESCRIPTION_READY',patientId});setTimeout(()=>{if(statusEl.textContent.includes('Conectando'))statusEl.textContent='Prescrição aberta'},1400);
})();
</script>
</body>
</html>
